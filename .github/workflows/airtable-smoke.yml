name: School House Airtable export smoke

on:
  push:
    branches: ["add-airtable-calendar"]
    paths:
      - "scripts/fetch_school_house_airtable.py"
      - "src/free_food_dartmouth/sources/school_house_airtable.py"
      - ".github/workflows/airtable-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"
      - name: Install Chromium
        run: uv run --with playwright playwright install --with-deps chromium
      - name: Test public Airtable export
        run: uv run --with playwright python scripts/fetch_school_house_airtable.py "$RUNNER_TEMP/school-house-airtable.ics"
      - name: Validate export with actual food matcher
        env:
          SCHOOL_HOUSE_AIRTABLE_ICS: ${{ runner.temp }}/school-house-airtable.ics
        run: |
          uv sync --frozen
          uv run python -c 'from datetime import date; from free_food_dartmouth.matcher import match_event; from free_food_dartmouth.sources.school_house_airtable import SchoolHouseAirtableSource; scan = SchoolHouseAirtableSource().scan(date(2026, 10, 14), date(2026, 11, 4)); matched = [e for e in scan.events if match_event(e)]; print("Live Airtable:", len(scan.events), "events,", len(matched), "food matches, complete:", scan.complete); assert scan.complete and len(scan.events) >= 20 and len(matched) >= 3'
